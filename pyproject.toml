[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-cdc-pyspark"
version = "0.3.0"
description = "Platform-agnostic PySpark streaming source for SQL Server CDC, with a partition-finalization (completeness) signal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuel Luis" }]
keywords = ["spark", "pyspark", "sql-server", "cdc", "delta-lake", "datasource-v2", "arrow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
# mssql-python is the default backend, imported only when it opens a connection (ADR 0003).
# pyarrow 18 is PySpark 4.2's floor, but imported before mssql_python it crashes the
# interpreter on Windows (access violation); 19 does not.
dependencies = ["pyarrow>=19", "mssql-python>=1.5"]

[project.optional-dependencies]
# PySpark itself is not a hard dependency: managed platforms (Databricks, EMR,
# Fabric...) ship their own. Install the "spark" extra for local runs.
spark = ["pyspark>=4.2", "delta-spark>=4.4"]
arrow-odbc = ["arrow-odbc>=10"]

[dependency-groups]
# Tests and lab/ (not packaged). `uv sync` installs this group by default.
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "pyspark>=4.2",
    "delta-spark>=4.4",
    "faker>=30",
    "testcontainers>=4.15",
    "ruff>=0.16",
    "mypy>=2.0",
    "pyright>=1.1.414",
]
# The documentation site (ADR 0024): `uv run --group docs zensical build --strict`.
docs = [
    "zensical>=0.0.67",
    "mkdocstrings-python>=2.0.9",
]

[project.urls]
Homepage = "https://github.com/emanuel-luis/mssql-cdc-pyspark"
Repository = "https://github.com/emanuel-luis/mssql-cdc-pyspark"
Issues = "https://github.com/emanuel-luis/mssql-cdc-pyspark/issues"
Changelog = "https://github.com/emanuel-luis/mssql-cdc-pyspark/blob/main/CHANGELOG.md"
Documentation = "https://emanuel-luis.github.io/mssql-cdc-pyspark/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration tests: pytest -m sqlserver (needs Docker)
addopts = ["-ra", "--strict-markers", "--strict-config", "--durations=25", "-m", "not sqlserver"]
# A hung stream aborts the whole run after dumping every thread's stack (the thread method
# ends the process, so no later test or report runs) instead of running until the CI job's
# own limit.
timeout = 900
timeout_method = "thread"
markers = [
  # Delta Lake jars need Maven access on the first run
  "delta: needs Delta Lake (takes the delta_spark fixture; tests/conftest.py adds the marker)",
  # a -m on the command line replaces addopts' one: the JVM-free loop is
  # -m "not spark and not sqlserver" (make test-fast)
  "spark: starts the JVM (takes the spark fixture; tests/conftest.py adds the marker)",
  "sqlserver: integration tests against SQL Server 2022 in Docker (testcontainers)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff >= 0.16 selects a broad default set; add only what it leaves out.
extend-select = ["BLE"]  # every broad except says why: `# noqa: BLE001 - reason`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
"lab/**" = ["DTZ"]
"examples/databricks_notebook.py" = ["F821"]  # spark and dbutils are injected by the runtime

[tool.mypy]
files = ["src", "tests/typing_*.py"]  # the latter: the public API's types
python_version = "3.10"
# every def annotated, no bare generics, no Any returned as a typed value, a name imported
# into a module exported only through its __all__, strict equality...
strict = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# pyspark, delta and mssql_python ship py.typed; these do not.
module = ["pyarrow.*", "arrow_odbc.*"]
ignore_missing_imports = true
