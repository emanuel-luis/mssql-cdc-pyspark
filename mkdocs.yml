# The documentation site, built by Zensical (ADR 0024):
#   uv run --group docs zensical build --strict   # into site/
#   uv run --group docs zensical serve            # preview on localhost:8000
site_name: mssql-cdc-pyspark
site_description: PySpark streaming source for SQL Server CDC, with a Delta sink and a completeness signal
site_url: https://emanuel-luis.github.io/mssql-cdc-pyspark/
repo_url: https://github.com/emanuel-luis/mssql-cdc-pyspark
repo_name: emanuel-luis/mssql-cdc-pyspark
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Emanuel Luis, MIT license"
docs_dir: docs
site_dir: site

theme:
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.footer
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false # static analysis only: never imports pyspark
            docstring_style: google
            filters: public
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_bases: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format  # Zensical resolves the name; keeps the YAML safe
  - pymdownx.tabbed:
      alternate_style: true

