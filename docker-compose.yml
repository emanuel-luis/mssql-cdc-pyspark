# Local SQL Server 2022 with SQL Server Agent (required: the CDC capture and
# cleanup jobs are Agent jobs). Developer edition, for testing only. Another
# version: set MSSQL_IMAGE, e.g. mcr.microsoft.com/mssql/server:2017-latest (LAB.md).
#
#   cp .env.example .env    # set MSSQL_SA_PASSWORD
#   docker compose up -d
#
# Apple Silicon: the image is linux/amd64 only; enable Rosetta emulation in
# Docker Desktop (Settings > General > "Use Rosetta for x86_64/amd64 emulation").
services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: linux/amd64
    container_name: mssql-cdc-lab
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
      # Server clock timezone. Leave UTC, or set e.g. America/Sao_Paulo to see how
      # cdc.lsn_time_mapping.tran_end_time behaves with a non-UTC server (check t2).
      TZ: "${MSSQL_TZ:-UTC}"
    ports:
      # This machine only: sa with a lab password. To reach it from elsewhere (a cluster,
      # another host), widen it deliberately, e.g. "0.0.0.0:..." behind a firewall.
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "$$(ls /opt/mssql-tools*/bin/sqlcmd | tail -1) -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mssql-data:
