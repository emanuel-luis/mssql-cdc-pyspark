# Monthly update PRs, one group per ecosystem for minor and patch: the SHA-pinned actions and
# uv.lock.
# Semver-major version updates are ignored (majors move by hand) and a release waits 7 days
# before it is proposed. Security updates skip the schedule and the cooldown.
# .github/workflows/dependabot-auto-merge.yml merges these PRs once CI is green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      github-actions: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      uv: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
