name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # per event: a push to main would otherwise cancel a weekly or manual run left pending
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11" }
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      # the public API fully typed: verifytypes fails below a type completeness of 100%
      - run: uv run pyright --verifytypes mssql_cdc --ignoreexternal

  docs:
    name: docs (site builds in strict mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        # its own cache: lint's key is the same, and a docs-only cache would leave out the dev group
        with: { python-version: "3.11", cache-suffix: docs }
      - run: uv run --locked --only-group docs zensical build --strict

  unit:
    name: unit (${{ matrix.shard.name }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on the weekly and manual runs; 3.11 otherwise.
        python: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["3.10","3.11","3.12","3.13"]') || fromJSON('["3.11"]') }}
        # The two longest Delta files side by side with the rest, which takes every other
        # file by --ignore: a new test file or compat version needs no change here.
        shard:
          - { name: silver, args: tests/test_silver.py }
          - { name: delta-sink, args: tests/test_delta_sink.py }
          - { name: rest, args: --ignore=tests/test_silver.py --ignore=tests/test_delta_sink.py }
    env:
      MSSQL_CDC_TEST_DELTA: require  # no silent fallback to plain Spark (tests/conftest.py)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2.5.2  # Spark 4's Ivy directory: the Delta jars
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-  # a new uv.lock still starts from the jars
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "${{ matrix.python }}", activate-environment: true }
      - run: uv sync --locked
      - run: pytest -q --timeout=300 ${{ matrix.shard.args }}

  integration:
    name: integration (${{ matrix.backend }}, SQL Server 2022 via testcontainers)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # arrow-odbc runs only the tests that take the backend fixture (tests/integration/conftest.py)
        backend: [mssql-python, arrow-odbc]
    env:
      MSSQL_CDC_TEST_BACKEND: ${{ matrix.backend }}
      MSSQL_CDC_TEST_DELTA: require  # no silent fallback to plain Spark (tests/conftest.py)
      MSSQL_CDC_TEST_SQLSERVER: require  # no Docker fails the tests instead of skipping them all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2.5.2  # Spark 4's Ivy directory: the Delta jars
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-  # a new uv.lock still starts from the jars
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11", activate-environment: true }
      - name: System libraries for mssql-python; unixODBC and ODBC Driver 18 for arrow-odbc
        run: |
          sudo apt-get update
          packages="libltdl7 libkrb5-3 libgssapi-krb5-2"
          if [ "$MSSQL_CDC_TEST_BACKEND" = arrow-odbc ]; then
            # Microsoft's repository as its docs set it up, unless the runner image has it already
            if ! apt-cache show msodbcsql18 > /dev/null 2>&1; then
              curl -sSfL -o /tmp/packages-microsoft-prod.deb \
                "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
              sudo dpkg -i /tmp/packages-microsoft-prod.deb
              sudo apt-get update
            fi
            packages="$packages msodbcsql18 unixodbc"
          fi
          sudo ACCEPT_EULA=Y apt-get install -y $packages
      - run: uv sync --locked ${{ matrix.backend == 'arrow-odbc' && '--extra arrow-odbc' || '' }}
      - run: pytest -q -m sqlserver

  lab:
    name: lab (${{ matrix.part }}, SQL Server 2022 CDC, end to end)
    runs-on: ubuntu-latest
    needs: lint
    # idle: t1 (11 min) and the destructive t7 (23 min) in the last scheduled run
    timeout-minutes: ${{ matrix.part == 'idle' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Each part on a fresh server. A green run's steps: core ~8 min, t10 ~9, t10 --resnapshot
        # ~12. idle, on the weekly and manual runs only, needs nothing else on its server.
        part: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["core","t10","t10-resnapshot","idle"]') || fromJSON('["core","t10","t10-resnapshot"]') }}
    env:
      MSSQL_SA_PASSWORD: "CI_Str0ng_Passw0rd"
      MSSQL_HOST: localhost
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_DATABASE: cdc_lab
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_AGENT_ENABLED: "true"
          MSSQL_SA_PASSWORD: "CI_Str0ng_Passw0rd"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CI_Str0ng_Passw0rd -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2.5.2  # Spark 4's Ivy directory: the Delta jars
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-  # a new uv.lock still starts from the jars
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11", activate-environment: true }
      - name: System libraries for mssql-python
        run: sudo apt-get update && sudo apt-get install -y libltdl7 libkrb5-3 libgssapi-krb5-2
      - run: uv sync --locked
      - run: python -m lab.workload setup
      - if: matrix.part == 'core' || matrix.part == 'idle'
        run: python -m lab.workload seed --customers 200 --orders 500
      - if: matrix.part == 'core'
        run: python -m lab.checks.t2_timezone
      - if: matrix.part == 'core'
        run: python -m lab.checks.t3_read_semantics
      - if: matrix.part == 'core'
        run: python -m lab.checks.t4_watermark_concurrency --long-seconds 45
      - if: matrix.part == 'core'
        run: python -m lab.checks.t5_engine
      - if: matrix.part == 'core'
        run: python -m lab.checks.t6_delta_semantics
      - if: matrix.part == 'core'
        run: python -m lab.checks.t7_end_to_end --transactions 200 --max-commits 50
      - if: matrix.part == 'core'
        run: python -m lab.checks.t9_capture_instance_switch
      - if: matrix.part == 'core'
        run: python examples/local_pipeline.py
      - if: matrix.part == 't10'
        run: python -m lab.checks.t10_chunked_snapshot
      - if: matrix.part == 't10-resnapshot'
        run: python -m lab.checks.t10_chunked_snapshot --resnapshot
      - name: t1 idle heartbeat (informational; measures the interval between idle entries)
        if: matrix.part == 'idle'
        run: python -m lab.checks.t1_idle_heartbeat --minutes 11 --interval 10
        continue-on-error: true
      - name: t7 with idle period and retention guard (destructive, last)
        if: matrix.part == 'idle'
        run: python -m lab.checks.t7_end_to_end --transactions 50 --idle-minutes 6 --destructive
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: "lab-results-${{ matrix.part }}", path: lab/results/ }
