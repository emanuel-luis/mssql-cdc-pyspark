name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11" }
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy

  docs:
    name: docs (site builds in strict mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11" }
      - run: uv run --locked --only-group docs zensical build --strict

  unit:
    name: unit (Spark engine + fake CDC + Delta)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11", activate-environment: true }
      - run: uv sync --locked
      - run: pytest -q

  integration:
    name: integration (SQL Server 2022 via testcontainers)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11", activate-environment: true }
      - name: System libraries for mssql-python
        run: sudo apt-get update && sudo apt-get install -y libltdl7 libkrb5-3 libgssapi-krb5-2
      - run: uv sync --locked
      - run: pytest -q -m sqlserver -rxs

  lab:
    name: lab (SQL Server 2022 CDC, end to end)
    runs-on: ubuntu-latest
    needs: unit
    env:
      MSSQL_SA_PASSWORD: "CI_Str0ng_Passw0rd"
      MSSQL_HOST: localhost
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_DATABASE: cdc_lab
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_AGENT_ENABLED: "true"
          MSSQL_SA_PASSWORD: "CI_Str0ng_Passw0rd"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CI_Str0ng_Passw0rd -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { python-version: "3.11", activate-environment: true }
      - name: System libraries for mssql-python
        run: sudo apt-get update && sudo apt-get install -y libltdl7 libkrb5-3 libgssapi-krb5-2
      - run: uv sync --locked
      - run: python -m lab.workload setup
      - run: python -m lab.workload seed --customers 200 --orders 500
      - run: python -m lab.checks.t2_timezone
      - run: python -m lab.checks.t3_read_semantics
      - run: python -m lab.checks.t4_watermark_concurrency --long-seconds 45
      - run: python -m lab.checks.t5_engine
      - run: python -m lab.checks.t6_delta_semantics
      - run: python -m lab.checks.t7_end_to_end --transactions 200 --max-commits 50
      - run: python examples/local_pipeline.py
      - name: t1 idle heartbeat (informational; measures the interval between idle entries)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m lab.checks.t1_idle_heartbeat --minutes 11 --interval 10
        continue-on-error: true
      - name: t7 with idle period and retention guard (destructive, last)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m lab.checks.t7_end_to_end --transactions 50 --idle-minutes 6 --destructive
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lab-results, path: lab/results/ }
