name: release

# A version tag publishes to PyPI (after the "pypi" environment's reviewer approves);
# a manual run is a dry run to TestPyPI. Steps in docs/RELEASING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }  # origin/main, for the check below
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.11", enable-cache: false }
      - name: Tag matches the version in pyproject.toml
        if: github.event_name == 'push'
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Tagged commit is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CHANGELOG.md has the release's section (its state compatibility, ADR 0021)
        if: github.event_name == 'push'
        run: grep -q "^## \[$(uv version --short)\]" CHANGELOG.md
      - run: uv build
      # Uploaded before anything else is installed: later steps cannot change what is published.
      # A failing check below still fails the job, and the publish jobs need it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: dist/ }
      - run: uvx twine==7.0.0 check --strict dist/*
      - name: Smoke test (install each distribution, import, print the version)
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$f" --with "pyspark>=4.2" \
              python -c "import mssql_cdc, importlib.metadata as m; print(m.version('mssql-cdc-pyspark'))"
          done

  testpypi:
    name: publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mssql-cdc-pyspark
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mssql-cdc-pyspark
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      # Trusted Publishing: no token. Attestations are generated by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
